  - id: feishu-card-cli-analysis
    name: 飞书卡片 CLI 方案分析
    category: knowledge-management
    description: >
      分析飞书卡片需求，设计三层架构（自然语言触发→模板+变量→CLI），
      分离变量与锚点，选择实现路径，映射业务场景到卡片类型，设计跨群分发策略。
    input: "飞书卡片需求 + 业务场景（如 E3 AI 工作台运营/审单/预警场景）"
    process:
      - "设计三层架构：自然语言触发层 → 模板+变量层 → 飞书 CLI 层"
      - "分离变量（每次变化的内容：标题/数据/链接）与锚点（品牌一致性：颜色/布局/按钮文案）"
      - "选择实现路径：cardkit（一次性复杂卡片）/ CLI（日常高频发卡）/ Skill（自然语言触发）"
      - "映射业务场景到卡片类型：推送类/交互类/预警类/周报类"
      - "设计跨群分发策略：按 chat_id 区分目标群，差异化推送内容"
    output: "卡片设计规范 + 实现方案（含变量-锚点表、卡片类型映射表、跨群分发配置）"
    tools: ["feishu", "lark-cli", "hermes-agent"]
